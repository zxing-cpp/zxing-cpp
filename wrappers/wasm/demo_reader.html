<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>zxing-cpp/wasm reader demo</title>
	<link rel="shortcut icon" href="#" />
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; background: #f2f5f2; color: #23312a; font: 16px/1.5 system-ui, sans-serif; }
	main { max-width: 960px; width: calc(100% - 32px); margin: 32px auto; padding: 24px; background: #fff; border: 1px solid #d9e1da; border-radius: 8px; }
		h1 { margin: 0; font-size: 1.6rem; line-height: 1.25; }
		.intro { margin: 8px 0 22px; color: #5a675f; }
		.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 0; margin-bottom: 18px; border-block: 1px solid #e0e6e0; }
		.control { display: flex; align-items: center; gap: 8px; font-weight: 600; }
		select, input[type="file"] { max-width: 100%; font: inherit; }
		select { padding: 5px 8px; border: 1px solid #b8c5bc; border-radius: 4px; background: #fff; }
		canvas { display: block; max-width: 100%; height: auto; margin: 0 auto 20px; }
		h2 { margin: 20px 0 4px; font-size: 1.1rem; }
		.results { margin: 0; padding-left: 1.5rem; }
		.results li { padding: 8px 0; border-bottom: 1px solid #e4e9e5; }
		.results pre { margin: 5px 0; color: #536159; font-size: .875rem; white-space: pre-wrap; overflow-wrap: anywhere; }
		.scan-time { margin: 14px 0 0; color: #315f4c; font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
		@media (max-width: 600px) {
			main { margin: 16px auto; padding: 18px; }
			.controls { gap: 8px; }
			.file-control { width: 100%; min-width: 0; flex-wrap: wrap; }
			.file-control input { width: 100%; min-width: 0; }
		}
	</style>
	<script src="zxing_reader.js"></script>
	<script>
var zxing = ZXing().then(function(instance) {
	zxing = instance; // this line is supposedly not required but with current emsdk it is :-/
});

async function readBarcodes() {
	const startTime = performance.now();
	let format = document.getElementById("format").value;
	let file = document.getElementById("file").files[0];

	let arrayBuffer = await file.arrayBuffer();
	let u8Buffer = new Uint8Array(arrayBuffer);

	let zxingBuffer = zxing._malloc(u8Buffer.length);
	zxing.HEAPU8.set(u8Buffer, zxingBuffer);
	let results = zxing.readBarcodesFromImage(zxingBuffer, u8Buffer.length, true, format, 0xff);
	zxing._free(zxingBuffer);

	showResults(results);
	showImageWithResults(file, results);
	document.getElementById("scanTime").textContent = `Scan time: ${(performance.now() - startTime).toFixed(2)} ms`;
}

function showImageWithResults(file, results) {
	var canvas = document.getElementById("canvas");
	var img = new Image()
	img.addEventListener('load', function() {
		canvas.width = img.width;
		canvas.height = img.height;
		const ctx = canvas.getContext("2d");
		ctx.drawImage(img, 0, 0);

		for (let i = 0; i < results.size(); i += 1) {
			const { position } = results.get(i);
			// Draw outline square
			ctx.beginPath();
			ctx.moveTo(position.topLeft.x, position.topLeft.y);
			ctx.lineTo(position.topRight.x, position.topRight.y);
			ctx.lineTo(position.bottomRight.x, position.bottomRight.y);
			ctx.lineTo(position.bottomLeft.x, position.bottomLeft.y);
			ctx.closePath();
			ctx.strokeStyle = "red";
			ctx.lineWidth = 4;
			ctx.stroke();

			// Draw number inside square
			const text = {
				text: i + 1,
				size: Math.abs((position.bottomRight.y - position.topLeft.y)) / 2,
				x: (position.topLeft.x + position.bottomRight.x) / 2.0,
				y: (position.topLeft.y + position.bottomRight.y) / 2.0,
			};
			ctx.fillStyle = "white";
			ctx.font = `bold ${text.size}px sans`;
			ctx.textAlign = "center";
			ctx.textBaseline = "middle";
			ctx.fillText(text.text, text.x, text.y);
			ctx.strokeStyle = "red";
			ctx.lineWidth = 2;
			ctx.strokeText(text.text, text.x, text.y);
		}
	});
	img.src = URL.createObjectURL(file)
}

function escapeTags(htmlStr) {
	return htmlStr.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function u8a2hex(bytes) {
	return bytes.reduce((a, b) => a + b.toString(16).padStart(2, '0') + ' ', '');
}

function showResults(results) {
	const resultsDiv = document.getElementById("results");
	resultsDiv.innerHTML = "";
	if (results.size() === 0) {
		const format = document.getElementById("format");
		const selectedFormat = format.selectedOptions[0].textContent;
		resultsDiv.innerHTML += selectedFormat === "All" ? "No barcode found" : `No ${selectedFormat} found`;
	}
	else {
		for (let i = 0; i < results.size(); i += 1) {
			const { format, text, bytes, error } = results.get(i);
			resultsDiv.innerHTML += "<li>Format: <strong>" + format + "</strong>"
				+ "<pre>" + (escapeTags(text) || '<font color="red">Error: ' + error + '</font>') + "</pre>"
				+ "<pre>" + u8a2hex(bytes) + "</pre>"
				+ "</li>";
		}
	}
}
	</script>
</head>

<body>
	<main>
	<h1>zxing-cpp/wasm reader demo</h1>
	<p class="intro">
		This is a simple demo of the wasm wrapper of <a href="https://github.com/zxing-cpp/zxing-cpp">zxing-cpp</a>
		scanning for barcodes in image files.
	</p>
	<div class="controls">
		<label class="control" for="format">Scan format
		<select id="format" onchange='readBarcodes()'>
			<option value="All" selected="">All</option>
			<option value="AllLinear">All Linear</option>
			<option value="AllMatrix">All Matrix</option>
			<option value="Aztec">Aztec</option>
			<option value="Codabar">Codabar</option>
			<option value="Code39">Code 39</option>
			<option value="Code93">Code 93</option>
			<option value="Code128">Code 128</option>
			<option value="DataMatrix">Data Matrix</option>
			<option value="DataBar">DataBar</option>
			<option value="DataBarExp">DataBar Expanded</option>
			<option value="DataBarLtd">DataBar Limited</option>
			<option value="DXFilmEdge">DX Film Edge</option>
			<option value="EAN8">EAN-8</option>
			<option value="EAN13">EAN-13</option>
			<option value="ITF">ITF</option>
			<option value="MaxiCode">MaxiCode</option>
			<option value="Telepen">Telepen</option>
			<option value="PDF417">PDF417</option>
			<option value="QRCode">QR Code</option>
			<option value="MicroQRCode">Micro QR Code</option>
			<option value="RMQRCode">rMQR Code</option>
			<option value="UPCA">UPC-A</option>
			<option value="UPCE">UPC-E</option>
		</select>
		</label>
		<label class="control file-control" for="file">Image file
		<input id="file" type="file" accept="image/png, image/jpeg" onchange="readBarcodes()" />
		</label>
	</div>

	<canvas id="canvas" width="640" height="480"></canvas>

	<h2>Results</h2>
	<ol id="results" class="results"></ol>
	<p id="scanTime" class="scan-time" aria-live="polite">Scan time: --</p>
	</main>
</body>

</html>
