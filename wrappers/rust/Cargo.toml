[package]
name = "zxing-cpp"
version = "0.5.4-rc1" # (e.g. 1.0.0-rc1) contains zxing-cpp version 3.2.0-rc1
edition = "2024"
rust-version = "1.85"
# authors = ["Axel Waggershauser <zxingcpp@gmail.com>"]
license = "Apache-2.0"
description = "A rust wrapper for the zxing-cpp barcode library."
repository = "https://github.com/zxing-cpp/zxing-cpp/"
readme = "README.md"
keywords = ["zxing", "barcode", "barcode_reader", "ffi"]
categories = ["api-bindings", "computer-vision"]
exclude = ["core/**/*Writer*", "core/src/*/*Encoder*", "core/src/ReedSolomonEncoder.*", "zint/backend/t*/**"]

[lib]
name = "zxingcpp"
path = "src/lib.rs"

[features]
default = []
image = ["dep:image"]
bundled = []

[dependencies]
thiserror = "2"
paste = "1.0"
image = { version = "0.25", optional = true }

[dev-dependencies]
cfg-if = "1.0"
anyhow = "1.0"
image = { version = "0.25" }

[build-dependencies]
cmake = { version = "0.1.50" }
