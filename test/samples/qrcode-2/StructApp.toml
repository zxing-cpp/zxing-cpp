TextEscaped = "initrd vs initramfs<LF><LF>Monolithic vs Modular kernel vs MicroKernel<LF><LF>Monolithic:<LF>    All drivers, operations and code to perform kernel related tasks are compilied into the kernel.  Interactions with kernel are done through system calls.<LF>    advantages:<LF>        1)  Less code = less complexity<LF>        2)  Less code = smaller size<LF>        3)  Less code = fewer bugs and security issues<LF>    disadvantages<LF>        1)  difficult to patch and test<LF>        2)  bugs can affect large parts of system<LF>  <LF>Microkernel<LF>    Only the fundamental tasks and drives are handled by the kernel - memory management, passing messages between processes.  <LF>    All other tasks are handled in user space by \"servers\" or \"user-mode servers.\"<LF>    advantages<LF>        1)  easier to maintain<LF>        2)  testing is easier - can swap patches in and out<LF>    disadvantages<LF>        1)  Larger running footprint<LF>        2)  More complex to interact with - port calls from user-mode servers<LF>        3)  Process management can be more complex<LF>        <LF>Modular Kernel<LF>    A monolithic kernel with binary modules/drivers that can me dynamically loaded or unloaded.<LF>    advantages:<LF>        1)  Faster and easier development for drivers that can operate as modules<LF>        2)  Easier to added drivers/services via modules<LF>    disadvantages<LF>        1)  More interfaces to pass through increases possibility of bugs<LF>        2)  Maintaining modules can be more difficult<LF>        <LF><LF>To be clear, loading a module dynamically into the kernel can incure some overhead compared to having the module compiled into the kernel.  But, <LF>this can be offset by having an overall smaller footprint in the monolithic kernel due to not having unnecessary code compiled into the kernel.  This <LF>is chiefly beneficial to embedded systems.<LF>        <LF>        <LF>        <LF>        <LF>        <LF>Resources <LF><LF>http://www.systhread.net/texts/200510kdiff.php<LF>http://en.wikipedia.org/wiki/Microkernel<LF>http://en.wikipedia.org/wiki/Monolithic_kernel<LF>http://en.wikipedia.org/wiki/Initramfs<LF>"
